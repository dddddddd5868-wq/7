{% load static %}
<header class="header">
  <div class="container header__inner">
    <a href="{% url 'home' %}" class="logo">
      {% if company and company.logo %}<img src="{{ company.logo.url }}" alt="{{ company.name }}">{% endif %}
      <span>{{ company.name }}</span>
    </a>
    <nav class="nav">
      <ul class="nav__list">
        <li><a href="{% url 'home' %}" class="nav__link">Главная</a></li>
        <li><a href="{% url 'about' %}" class="nav__link">О проекте</a></li>
        <li><a href="{% url 'services' %}" class="nav__link">Услуги</a></li>
        <li><a href="{% url 'contacts' %}" class="nav__link">Контакты</a></li>
      </ul>
      <a href="{% url 'contacts' %}" class="btn btn-primary">Связаться</a>
    </nav>
    <button class="burger" aria-label="Меню"><span></span><span></span><span></span></button>
  </div>
</header>
